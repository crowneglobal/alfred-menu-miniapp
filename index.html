<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Alfred</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  :root {
    --bg: #f6f7f8;
    --panel: #ffffff;
    --txt: #1e1f21;
    --sub: #6d6e6f;
    --faint: #9b9c9e;
    --line: #edecea;
    --accent: #4573d2;
    --accent-soft: #eaf0fb;
    --p1: #e8384f;
    --p2: #ec8c1c;
    --p3: #4573d2;
    --green: #3f9142;
    --green-soft: #e7f2e7;
    --gframe: #2fb457;
    --gline: #cfe6d4;
    --amber: #b07d00;
    --amber-soft: #fbf1d8;
    --red-soft: #fdeaec;
    --violet: #7b61ff;
    --violet-soft: #eeeaff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    border: 3px solid var(--gframe); border-radius: 22px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(47,180,87,.25), 0 0 18px rgba(47,180,87,.28); position: relative; }

  main { flex: 1; overflow-y: auto; padding: 12px 14px 112px; -webkit-overflow-scrolling: touch; }

  /* underline tab selector */
  .seg { display: flex; gap: 22px; padding: 0 4px; margin-bottom: 18px;
    border-bottom: 1px solid var(--line); overflow-x: auto; }
  .seg button { flex: none; background: none; border: none; padding: 0 0 10px;
    color: var(--sub); font-size: 14px; font-weight: 600; position: relative; }
  .seg button.active { color: var(--txt); }
  .seg button.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; border-radius: 2px; background: var(--accent); }

  /* section header above a panel */
  .sect { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 9px; }
  .sect .lbl { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;
    color: var(--sub); text-transform: uppercase; letter-spacing: .4px; }
  .sect .cnt { background: var(--bg); color: var(--sub); font-size: 11px; font-weight: 700;
    padding: 1px 8px; border-radius: 20px; }
  .sect .mtoggle { display: flex; gap: 6px; }
  .mbtn { background: var(--panel); color: var(--sub); border: 1px solid var(--line);
    border-radius: 8px; width: 32px; height: 30px; font-size: 15px; display:flex; align-items:center; justify-content:center; }
  .mbtn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  /* white panel holding rows */
  .panel { background: var(--panel); border: 1px solid var(--gline); border-radius: 12px;
    overflow: hidden; margin-bottom: 20px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row:active { background: #fafafa; }
  .row .body { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; font-size: 14.5px; color: var(--txt);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { color: var(--sub); font-size: 12.5px; margin-top: 3px;
    display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .chev { color: var(--faint); font-size: 18px; flex: none; }

  /* priority dot */
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.p1 { background: var(--p1); }
  .dot.p2 { background: var(--p2); }
  .dot.p3 { background: var(--p3); }

  /* pills */
  .pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; flex:none; }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); }
  .pill.coral { background: var(--red-soft); color: var(--p1); }
  .pill.violet{ background: var(--violet-soft); color: var(--violet); }
  .pill.gold  { background: var(--amber-soft); color: var(--amber); }
  .pill.blue  { background: var(--accent-soft); color: var(--accent); }

  .amt { font-weight: 700; font-size: 14.5px; flex: none; }
  .amt.pos { color: var(--green); }
  .amt.neg { color: var(--txt); }

  .avatar { width: 34px; height: 34px; border-radius: 50%; flex:none;
    display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:14px; }

  /* task row: checkbox + drag */
  .task.done .t { text-decoration: line-through; color: var(--faint); }
  .task.done .s { color: var(--faint); }
  .handle { color: var(--faint); font-size: 17px; cursor: grab; touch-action: none; flex:none; }
  .cbox { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #d3d4d6; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:#c7c8ca; }
  .cbox.on { background: var(--green); border-color: var(--green); color:#fff; }

  /* search bar + filter chips (Asana search format) */
  .searchbar { display:flex; align-items:center; gap:9px; background:var(--panel); border:1.5px solid var(--gline);
    border-radius:10px; padding:10px 13px; margin-bottom:12px; }
  .searchdock { position: fixed; left: 14px; right: 14px; bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 29; }
  .searchdock .searchbar { margin-bottom: 0; box-shadow: 0 8px 24px rgba(30,31,33,.10); }
  .searchbar .si { color:var(--faint); font-size:15px; }
  .searchbar input { border:none; outline:none; flex:1; font-size:14.5px; background:transparent; color:var(--txt); }
  .searchbar .clr { color:var(--faint); font-size:16px; padding:0 2px; }
  .fchips { display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; padding-bottom:2px; }
  .fchip { flex:none; padding:6px 15px; border:1px solid var(--line); border-radius:20px; font-size:13px;
    font-weight:600; color:var(--sub); background:var(--panel); }
  .fchip.active { color:var(--green); border-color:var(--gframe); background:var(--green-soft); }
  .hl { font-weight:800; color:var(--txt); }
  .res-sect { font-size:13px; font-weight:700; color:var(--sub); text-transform:uppercase;
    letter-spacing:.4px; margin:4px 4px 8px; }
  .rowicon { width:30px; height:30px; border-radius:8px; flex:none; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:13px; font-weight:800; }
  .ava-sm { width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center;
    justify-content:center; color:#fff; font-weight:700; font-size:11px; }
  .showmore { color:var(--accent); font-weight:600; font-size:13.5px; padding:12px 14px; }
  .arrows { display: flex; flex-direction: column; gap: 3px; flex: none; }
  .arrows button { background: var(--bg); border: none; color: var(--accent); width: 28px; height: 19px;
    border-radius: 5px; font-size: 10px; line-height: 1; }
  .arrows button:disabled { color: #d5d6d8; }
  .sortable-ghost { opacity: .4; }
  .sortable-chosen { background: #f4f7fd; }

  /* pay button */
  .paybtn { background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 6px 14px; font-size: 12.5px; font-weight: 700; flex: none; }

  nav {
    display: flex; background: var(--panel); border-top: 1px solid var(--line);
    padding: 4px 2px calc(4px + env(safe-area-inset-bottom)); flex: none;
  }
  nav button {
    flex: 1; background: none; border: none; color: var(--faint); padding: 7px 0 5px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; position: relative;
  }
  nav button .ne { font-size: 18px; line-height: 1; filter: grayscale(1) opacity(.6); }
  nav button.active { color: var(--accent); }
  nav button.active .ne { filter: none; }
  nav button.active .nl { color: var(--accent); font-weight: 700; }

  .sheet-back { position: fixed; inset: 0; background: rgba(30,31,33,.4); opacity:0; pointer-events:none; transition: opacity .2s; z-index: 40; }
  .sheet-back.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-radius: 18px 18px 0 0; padding: 8px 18px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); z-index: 41; max-height: 82vh; overflow-y:auto; }
  .sheet.on { transform: translateY(0); }
  .sheet .grip { width: 38px; height: 4px; border-radius: 4px; background: #dcdcdc; margin: 6px auto 16px; }
  .sheet h3 { margin: 0 0 4px; font-size: 18px; }
  .sheet .meta { color: var(--sub); font-size: 13px; margin-bottom: 18px; }
  .actrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .act { flex: 1; min-width: 44%; background: var(--bg); border: 1px solid var(--line); color: var(--txt);
    border-radius: 10px; padding: 13px; font-size: 14.5px; font-weight: 600; display:flex; align-items:center; justify-content:center; gap:8px; }
  .act.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .kv { display:flex; justify-content:space-between; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .kv:last-of-type { border-bottom: none; }
  .kv .k { color: var(--sub); }
  .taskhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
  .taskhead h3 { margin: 0; }
  .taskmeta-line { color: var(--sub); font-size: 14px; font-weight: 600; white-space: nowrap; text-align: right; }
  .cmtwrap { margin-top: 18px; }
  .cmtlist { display: flex; flex-direction: column; gap: 10px; }
  .cmt { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .cmtmeta { display:flex; align-items:center; justify-content:space-between; gap: 10px; margin-bottom: 5px; }
  .cmtname { font-size: 13px; font-weight: 700; color: var(--txt); }
  .cmttime { font-size: 12px; color: var(--faint); }
  .cmtbody { font-size: 13.5px; color: var(--sub); line-height: 1.35; }
  .composer { margin-top: 16px; }
  .composer textarea { width: 100%; min-height: 88px; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; font: inherit; color: var(--txt); background: var(--bg); outline: none; }
  .composer textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(69,115,210,.10); }
  .empty { text-align:center; color: var(--faint); padding: 48px 20px; font-size: 14px; }
  .ctxfab { position: fixed; right: 16px; bottom: calc(62px + env(safe-area-inset-bottom));
    min-width: 58px; height: 50px; padding: 0 16px; border-radius: 25px;
    background: rgba(255,255,255,.94); color: var(--sub); border: 1px solid var(--line);
    font-size: 13px; font-weight: 700; box-shadow: 0 8px 22px rgba(30,31,33,.12); z-index: 31;
    display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="searchdock" id="searchDock" style="display:none"></div>
<button class="ctxfab" id="ctxFab">DRO</button>
<div class="sheet-back" id="sheetBack"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetContent"></div></div>

<script>

} } catch(e){}
function haptic(t){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} }

/* ---------- mock data (shapes mirror the real Alfred menu) ---------- */

const LISTS = ['QBO','VET','LIR','FER'];
const LIST_CLR = {QBO:'#4573d2', VET:'#3f9142', LIR:'#b07d00', FER:'#e8384f'};
let activeList = 'QBO';

const DATA = {
  tasks: {

      {id:3, t:'Send parts list', s:'Maintenance · 5 items', pr:'', done:false, as:'Jordan Lee', ac:'#e8384f', srcGroup:'ALF Code Servers', srcThread:'Task Board', srcUrl:'https://t.me/c/1571211776/1', comments:[{name:'Jordan Lee', time:'6m ago', body:'I have 3 of the 5 serials, still missing the pump pair.'},{name:'DRO', time:'21m ago', body:'Post the list back in the maintenance thread once clean.'},{name:'Alex Morgan', time:'48m ago', body:'Using the old service sheet as the source of truth for now.'}]},

      {id:5, t:'Confirm weekly schedule', s:'Team · this week', pr:'', done:true, as:'Sam Rivera', ac:'#7b61ff', srcGroup:'Mission Control', srcThread:'Command Center', srcUrl:'https://t.me/c/3716119745/4', comments:[{name:'Sam Rivera', time:'11m ago', body:'Crew confirmed the Thursday handoff.'},{name:'DRO', time:'37m ago', body:'Lock Friday before posting the recap.'},{name:'Alex Morgan', time:'1h ago', body:'Only waiting on the airport pickup slot.'}]},
    ],
    VET: [
      {id:11, t:'Order stock', s:'Inventory', pr:'P1', done:false, as:'Casey Kim', ac:'#b07d00', srcGroup:'LHE Operations', srcThread:'Vet', srcUrl:'https://t.me/c/3716119745/6', comments:[{name:'Casey Kim', time:'4m ago', body:'Need final count from the barn before placing the order.'},{name:'DRO', time:'22m ago', body:'Keep this one in the vet thread, not general ops.'},{name:'Alex Morgan', time:'58m ago', body:'Supplier can still ship tomorrow if we confirm by 5.'}]},
      {id:12, t:'Call supplier re invoice', s:'Finance', pr:'', done:false, as:'Alex Morgan', ac:'#3f9142', srcGroup:'LHE Operations', srcThread:'Vet', srcUrl:'https://t.me/c/3716119745/6', comments:[{name:'Alex Morgan', time:'7m ago', body:'They asked for the old invoice number first.'},{name:'DRO', time:'24m ago', body:'If they stall, move this to priority.'},{name:'Casey Kim', time:'1h ago', body:'Last callback ended before they confirmed the balance.'}]},

    LIR: [ {id:21, t:'Run staff payroll', s:'Due Fri', pr:'P2', done:false, as:'Casey Kim', ac:'#b07d00', srcGroup:'Mission Control', srcThread:'HR', srcUrl:'https://t.me/c/3716119745/8', comments:[{name:'Casey Kim', time:'3m ago', body:'Need two final hour totals before payroll closes.'},{name:'DRO', time:'19m ago', body:'Post the draft numbers in HR first.'},{name:'Sam Rivera', time:'46m ago', body:'Overtime line is updated for the ranch crew.'}] } ],

  },

    {id:1, name:'Alex Morgan', s:'Family · WhatsApp', clr:'#3f9142'},
    {id:2, name:'Sam Rivera', s:'Advisor · call', clr:'#7b61ff'},

    {id:1, name:'Staff A', s:'Housekeeping · clocked in', clr:'#b07d00', on:true},

  ],
};

/* ---------- state ---------- */
let current = 'tasks';
let taskMode = 'reorder'; // reorder | open | priority
let taskQuery = '';
let taskFilter = 'Tasks';
const FILTERS = ['Tasks','Projects','People','Teams','Tags'];
const main = document.getElementById('main');
const searchDock = document.getElementById('searchDock');

/* ---------- render ---------- */
function setHeader(label){ document.title = label ? `Alfred · ${label}` : 'Alfred'; }

function render(){
  const f = FEATURES.find(x=>x.key===current);
  setHeader(f.label);
  const fab = document.getElementById('fab');
  if (fab) fab.style.display = (current==='tasks') ? 'flex' : 'none';
  searchDock.style.display = current==='tasks' ? 'block' : 'none';
  searchDock.innerHTML = '';
  if (current==='tasks') renderTasks();
  else if (current==='contacts') renderContacts();
  else if (current==='reminders') renderReminders();
  else if (current==='expenses') renderExpenses();
  else if (current==='payments') renderPayments();
  else if (current==='team') renderTeam();
  else if (current==='bhc') renderBHC();
  renderNav();
  updateMainButton();
}

function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function sect(lbl, cnt, right){ return `<div class="sect"><div class="lbl">${lbl}${cnt!=null?`<span class="cnt">${cnt}</span>`:''}</div>${right||''}</div>`; }

function renderTasks(){
  searchDock.innerHTML = `<div class="searchbar">
      <span class="si">🔍</span>
      <input id="tsearch" type="text" placeholder="Search" value="${esc(taskQuery)}" autocomplete="off">
      ${taskQuery?'<span class="clr" id="tclear">✕</span>':''}
    </div>`;
  let html = `<div class="fchips">` + FILTERS.map(f=>`<button class="fchip ${f===taskFilter?'active':''}" data-filter="${f}">${f}</button>`).join('') + `</div>`;
  html += `<div id="results"></div>`;
  main.innerHTML = html;

  const inp = document.getElementById('tsearch');
  inp.oninput = ()=>{ taskQuery = inp.value; const c=document.getElementById('tclear');
    renderResults();
    // toggle clear button without losing focus
    const sb=inp.parentElement;
    let clr=sb.querySelector('.clr');
    if(taskQuery && !clr){ clr=document.createElement('span'); clr.className='clr'; clr.id='tclear'; clr.textContent='✕'; clr.onclick=clearSearch; sb.appendChild(clr); }
    else if(!taskQuery && clr){ clr.remove(); }
  };
  const clrBtn=document.getElementById('tclear'); if(clrBtn) clrBtn.onclick=clearSearch;
  main.querySelectorAll('.fchip').forEach(b=>b.onclick=()=>{ taskFilter=b.dataset.filter; haptic(); renderResults();
    main.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('active', x.dataset.filter===taskFilter)); });

  renderResults();
}

function clearSearch(){ taskQuery=''; haptic(); render(); }

function renderResults(){
  const box = document.getElementById('results');
  const q = taskQuery.trim().toLowerCase();

  if(!q){
    // default: To-do list for active list, with segmented list switcher + reorder handles
    const list = DATA.tasks[activeList];
    const openN = list.filter(t=>!t.done).length;
    const toggles = `<div class="mtoggle">
         <button class="mbtn ${taskMode==='reorder'?'active':''}" data-mode="reorder" title="Reorder">↕️</button>
         <button class="mbtn ${taskMode==='priority'?'active':''}" data-mode="priority" title="Priority">🥇</button>
         <button class="mbtn ${taskMode==='open'?'active':''}" data-mode="open" title="Open">💎</button>
       </div>`;
    let html = `<div class="seg">` + LISTS.map(l=>`<button class="${l===activeList?'active':''}" data-list="${l}">${l}</button>`).join('') + `</div>`;
    html += sect('To do', openN, toggles);
    if(!list.length){ html += `<div class="empty">No tasks in ${activeList}.<br>Tap + to add one.</div>`; }
    else { html += `<div class="panel" id="tasklist">`; list.forEach((task,i)=>{ html += taskRow(task,i,list.length); }); html += `</div>`; }
    box.innerHTML = html;

    box.querySelectorAll('.seg button').forEach(c=>c.onclick=()=>{ activeList=c.dataset.list; haptic(); renderResults(); });
    box.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>{ taskMode=b.dataset.mode; haptic(); renderResults(); });
    wireTaskRows();
    if(taskMode==='reorder' && window.Sortable){
      const el=document.getElementById('tasklist');
      if(el) Sortable.create(el,{ handle:'.handle', animation:160, ghostClass:'sortable-ghost', chosenClass:'sortable-chosen',
        onEnd:(e)=>{ const arr=DATA.tasks[activeList]; const [m]=arr.splice(e.oldIndex,1); arr.splice(e.newIndex,0,m); haptic('medium'); renderResults(); }});
    }
    return;
  }

  // search mode across all lists
  const allTasks = [];
  LISTS.forEach(l=>DATA.tasks[l].forEach(t=>allTasks.push({...t, list:l})));
  const showTasks = taskFilter==='Tasks' || taskFilter==='Tags';
  const showProjects = taskFilter==='Projects';
  const showPeople = taskFilter==='People' || taskFilter==='Teams';

  const matchTasks = (taskFilter==='Tasks'||taskFilter==='Tags') ? allTasks.filter(t=>t.t.toLowerCase().includes(q) || (t.s||'').toLowerCase().includes(q)) : [];
  const projects = LISTS.map(l=>({name:l, n:DATA.tasks[l].length, clr: LIST_CLR[l]||'#4573d2'}));
  const matchProjects = showProjects ? projects.filter(p=>p.name.toLowerCase().includes(q)) : [];
  const matchPeople = showPeople ? DATA.contacts.filter(c=>c.name.toLowerCase().includes(q)) : [];

  let html = '';
  const TASK_CAP = 4;

  if(showTasks && matchTasks.length){
    html += `<div class="res-sect">Tasks</div><div class="panel">`;
    matchTasks.slice(0,TASK_CAP).forEach(t=>{
      const dot = t.pr ? `<span class="dot ${t.pr==='P1'?'p1':t.pr==='P2'?'p2':'p3'}"></span>` : '';
      html += `<div class="row task ${t.done?'done':''}" data-sopen="${t.id}" data-slist="${t.list}">
        <div class="cbox ${t.done?'on':''}">✓</div>
        <div class="body"><div class="t">${hlt(t.t,q)}</div>
          <div class="s">${dot}<span>${t.list} · ${hlt(t.s||'',q)}</span></div></div>
        ${t.as?`<div class="ava-sm" style="background:${t.ac}">${t.as.trim()[0]}</div>`:''}
      </div>`;
    });
    if(matchTasks.length>TASK_CAP) html += `<div class="showmore">Show ${matchTasks.length-TASK_CAP} more</div>`;
    html += `</div>`;
  }

  if(showProjects && matchProjects.length){
    html += `<div class="res-sect">Projects</div><div class="panel">`;
    matchProjects.forEach(p=>{
      html += `<div class="row"><div class="rowicon" style="background:${p.clr}">${p.name[0]}</div>
        <div class="body"><div class="t">${hlt(p.name,q)}</div><div class="s">${p.n} task${p.n===1?'':'s'}</div></div>
        <span class="chev">›</span></div>`;
    });
    html += `</div>`;
  }

  if(showPeople && matchPeople.length){
    html += `<div class="res-sect">People</div><div class="panel">`;
    matchPeople.forEach(c=>{
      html += `<div class="row"><div class="avatar" style="background:${c.clr}">${c.name.trim()[0]}</div>
        <div class="body"><div class="t">${hlt(c.name,q)}</div><div class="s">${esc(c.s)}</div></div>
        <span class="chev">›</span></div>`;
    });
    html += `</div>`;
  }

  if(!html) html = `<div class="empty">No results for “${esc(taskQuery)}”.</div>`;
  box.innerHTML = html;

  box.querySelectorAll('[data-sopen]').forEach(el=>el.onclick=()=>openTask(+el.dataset.sopen, el.dataset.slist));
  box.querySelectorAll('.showmore').forEach(el=>el.onclick=()=>haptic());
}

// highlight matched substring, HTML-escaped
function hlt(text, q){
  const s = esc(text||''); if(!q) return s;
  const lc = (text||'').toLowerCase(); const i = lc.indexOf(q);
  if(i<0) return s;
  return esc(text.slice(0,i)) + `<span class="hl">` + esc(text.slice(i,i+q.length)) + `</span>` + esc(text.slice(i+q.length));
}

function taskRow(task,i,n){
  const drag = taskMode==='reorder' ? `<div class="handle">⠿</div>` : '';
  const arrows = taskMode==='reorder' ? `<div class="arrows">
      <button data-up="${i}" ${i===0?'disabled':''}>▲</button>
      <button data-down="${i}" ${i===n-1?'disabled':''}>▼</button></div>` : '';
  const dot = task.pr ? `<span class="dot ${task.pr==='P1'?'p1':task.pr==='P2'?'p2':'p3'}"></span>` : '';
  const ava = (task.as && taskMode!=='reorder') ? `<div class="ava-sm" style="background:${task.ac}">${task.as.trim()[0]}</div>` : '';
  return `<div class="row task ${task.done?'done':''}" data-id="${task.id}">
    ${drag}
    <div class="cbox ${task.done?'on':''}" data-check="${task.id}">✓</div>
    <div class="body" data-open="${task.id}" data-list="${activeList}">
      <div class="t">${esc(task.t)}</div>
      <div class="s">${dot}<span>${esc(task.s)}</span></div>
    </div>
    ${arrows}${ava}
  </div>`;
}

function wireTaskRows(){
  main.querySelectorAll('[data-check]').forEach(el=>el.onclick=(ev)=>{ ev.stopPropagation();
    const id=+el.dataset.check; const t=DATA.tasks[activeList].find(x=>x.id===id); t.done=!t.done; haptic(); renderResults(); });
  main.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{ const id=+el.dataset.open; openTask(id, el.dataset.list || activeList); });
  main.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));
  main.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1));
}
function move(i,dir){ const arr=DATA.tasks[activeList]; const j=i+dir; if(j<0||j>=arr.length) return;
  [arr[i],arr[j]]=[arr[j],arr[i]]; haptic('medium'); renderResults(); }

function renderContacts(){
  let html = sect('People', DATA.contacts.length);
  html += `<div class="panel">` + DATA.contacts.map(c=>`
    <div class="row" data-open="${c.id}">
      <div class="avatar" style="background:${c.clr}">${c.name.trim()[0]}</div>
      <div class="body"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.s)}</div></div>
      <span class="chev">›</span></div>`).join('') + `</div>`;
  main.innerHTML = html;
  main.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openGeneric('contacts',+el.dataset.open));
}

function renderReminders(){
  let html = sect('Upcoming', DATA.reminders.length);
  html += `<div class="panel">` + DATA.reminders.map(r=>`
    <div class="row" data-open="${r.id}">
      <div class="body"><div class="t">${esc(r.t)}</div><div class="s">${esc(r.s)}</div></div>
      <span class="pill ${r.clr}">${r.badge}</span></div>`).join('') + `</div>`;
  main.innerHTML = html;
  main.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openReminder(+el.dataset.open));
}

function renderExpenses(){
  const net = DATA.expenses.reduce((a,e)=>a + parseFloat(e.amt.replace(/[^-\d.]/g,'')),0);
  let html = sect('This week', null, `<span class="amt ${net>=0?'pos':'neg'}">${net>=0?'+':''}$${Math.abs(net).toFixed(2)}</span>`);
  html += `<div class="panel">` + DATA.expenses.map(e=>`
    <div class="row"><div class="body"><div class="t">${esc(e.t)}</div><div class="s">${esc(e.s)}</div></div>
      <span class="amt ${e.pos?'pos':'neg'}">${esc(e.amt)}</span></div>`).join('') + `</div>`;
  main.innerHTML = html;
}

function renderPayments(){
  const due = DATA.payments.filter(p=>p.due).length;
  let html = sect('Outgoing', due + ' due');
  html += `<div class="panel">` + DATA.payments.map(p=>`
    <div class="row"><div class="body"><div class="t">${esc(p.t)}</div><div class="s">${esc(p.s)}</div></div>
      ${p.due?`<span class="amt neg" style="margin-right:2px">${esc(p.amt)}</span><button class="paybtn" data-pay="${p.id}">Pay</button>`
             :`<span class="amt neg" style="margin-right:2px">${esc(p.amt)}</span><span class="pill green">paid</span>`}</div>`).join('') + `</div>`;
  main.innerHTML = html;
  main.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{ haptic('medium'); tg&&tg.showConfirm?tg.showConfirm('Send this payment?',()=>{}):alert('(demo) payment confirm'); });
}

function renderTeam(){
  let html = sect('Staff', DATA.team.length);
  html += `<div class="panel">` + DATA.team.map(t=>`
    <div class="row"><div class="avatar" style="background:${t.clr}">${t.name.trim()[0]}</div>
      <div class="body"><div class="t">${esc(t.name)}</div><div class="s">${esc(t.s)}</div></div>
      <span class="pill ${t.on?'green':'violet'}">${t.on?'on':'off'}</span></div>`).join('') + `</div>`;
  main.innerHTML = html;
}

function renderBHC(){
  const open = DATA.bhc.filter(b=>b.st!=='done').length;
  let html = sect('Bugs', open + ' open');
  html += `<div class="panel">` + DATA.bhc.map(b=>`
    <div class="row"><div class="body"><div class="t">${esc(b.t)}</div><div class="s">${esc(b.s)}</div></div>
      <span class="pill ${b.clr}">${b.st}</span></div>`).join('') + `</div>`;
  main.innerHTML = html;
}

/* ---------- detail sheets ---------- */
const sheet=document.getElementById('sheet'), sheetBack=document.getElementById('sheetBack'), sheetContent=document.getElementById('sheetContent');
function showSheet(html){ sheetContent.innerHTML=html; sheet.classList.add('on'); sheetBack.classList.add('on'); haptic(); }
function hideSheet(){ sheet.classList.remove('on'); sheetBack.classList.remove('on'); }
sheetBack.onclick=hideSheet;

function openTask(id, listKey=activeList){
  const list = DATA.tasks[listKey] || [];
  const t=list.find(x=>x.id===id); if(!t) return;
  const comments = (t.comments || []).slice(0,3).map(c=>`<div class="cmt"><div class="cmtmeta"><span class="cmtname">${esc(c.name)}</span><span class="cmttime">${esc(c.time)}</span></div><div class="cmtbody">${esc(c.body)}</div></div>`).join('') || `<div class="cmt"><div class="cmtbody">No comments yet.</div></div>`;
  showSheet(`<div class="taskhead"><h3>${esc(t.t)}</h3><div class="taskmeta-line">${t.done?'Done':'Open'} - ${esc(t.pr||'No priority')} - ${listKey}</div></div>
    <div class="cmtwrap"><div class="cmtlist">${comments}</div></div>
    <div class="composer"><textarea id="taskCommentInput" placeholder="Write a comment here"></textarea></div>
    <div class="actrow" style="margin-top:12px">
      <button class="act primary" id="aComment">Post comment</button>
      <button class="act" id="aSource">Group</button></div>
    <div class="actrow" style="margin-top:10px">
      <button class="act" id="aDone">${t.done?'Reopen':'Complete'}</button>
      <button class="act" id="aClose">Close</button></div>`);
  document.getElementById('aComment').onclick=()=>postTaskComment(t, listKey);
  document.getElementById('aSource').onclick=()=>openTaskSource(t);
  document.getElementById('aDone').onclick=()=>{ t.done=!t.done; hideSheet(); render(); };
  document.getElementById('aClose').onclick=hideSheet;
}

function postTaskComment(task, listKey){
  const input = document.getElementById('taskCommentInput');
  const body = input && input.value ? input.value.trim() : '';
  if(!body) return;
  task.comments = task.comments || [];
  task.comments.unshift({name:'DRO', time:'just now', body});
  haptic('medium');
  openTask(task.id, listKey);
}

function openTaskSource(task){
  const url = task && task.srcUrl;
  if(!url) return;
  haptic('medium');
  try {
    if(tg && tg.openTelegramLink && /^(https?:\/\/)?t\.me\//.test(url)) tg.openTelegramLink(url);
    else if(tg && tg.openLink) tg.openLink(url);
    else window.open(url, '_blank', 'noopener');
  } catch (e) {
    window.open(url, '_blank', 'noopener');
  }
}
function openReminder(id){
  const r=DATA.reminders.find(x=>x.id===id);
  showSheet(`<h3>${esc(r.t)}</h3><div class="meta">${esc(r.s)}</div>
    <div class="actrow">
      <button class="act">30m</button><button class="act">15m</button>
      <button class="act primary" style="min-width:100%">Completed</button></div>`);
  sheetContent.querySelectorAll('.act').forEach(b=>b.onclick=hideSheet);
}
function openGeneric(key,id){
  const item=DATA[key].find(x=>x.id===id); if(!item) return;
  const name=item.name||item.t;
  showSheet(`<h3>${esc(name)}</h3><div class="meta">${esc(item.s||'')}</div>
    <div class="actrow">
      <button class="act primary">Message</button>
      <button class="act">Details</button></div>`);
  sheetContent.querySelectorAll('.act').forEach(b=>b.onclick=hideSheet);
}

/* ---------- nav ---------- */
function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=FEATURES.map(f=>`<button data-key="${f.key}" class="${f.key===current?'active':''}">
     <span class="ne">${f.em}</span><span class="nl">${f.label}</span></button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ current=b.dataset.key; haptic(); hideSheet(); main.scrollTop=0; render(); });
}

/* ---------- Telegram MainButton ---------- */
function updateMainButton(){
  if(!tg||!tg.MainButton) return;
  if(current==='tasks'){ tg.MainButton.setText('Add task'); tg.MainButton.show(); }
  else tg.MainButton.hide();
}
if(tg&&tg.MainButton){ tg.MainButton.onClick(()=>addTask()); }
const fab = document.getElementById('fab');
if (fab) fab.onclick=()=>addTask();

function addTask(){
  const doAdd=(txt)=>{ if(!txt) return; const arr=DATA.tasks[activeList];
    arr.unshift({id:Date.now(), t:txt, s:'just now', pr:'', done:false}); haptic('medium'); render(); };
  const txt=prompt('New task in '+activeList+':'); doAdd(txt&&txt.trim());
}

render();
</script>
</body>
